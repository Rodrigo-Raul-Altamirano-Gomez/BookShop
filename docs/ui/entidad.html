<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autor, categoría o editorial · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="tienda" data-nav="explorar">
<main id="contenido" class="container-xl pt-4"></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
const pq = new URLSearchParams(location.search);
const tipo = pq.get("tipo") || "autor";
const nombre = pq.get("n") || { autor: "Inés Valdivia", categoria: "Novela", editorial: "Ediciones Faro" }[tipo];
const etiqueta = { autor: "Autores", categoria: "Categorías", editorial: "Editoriales" }[tipo];
const texto = tipo === "autor"
  ? "Escritora limeña (1978). Su obra mezcla la memoria familiar con lo fantástico, siempre en casas y barrios de la costa peruana. Ha publicado tres novelas y dos libros de poesía, y dirige talleres de escritura desde 2015."
  : tipo === "categoria"
    ? "Historias largas de ficción: de la novela histórica a la contemporánea, con autores de Latinoamérica y el mundo."
    : "Editorial independiente fundada en 2009. Publica narrativa y ensayo de autores latinoamericanos.";
document.title = nombre + " · BookShop";
document.getElementById("contenido").innerHTML = `
  <nav aria-label="Ruta"><ol class="breadcrumb bk-breadcrumb mb-4"><li class="breadcrumb-item"><a href="inicio.html">Inicio</a></li><li class="breadcrumb-item"><a href="explorar.html?tipo=${tipo}">${etiqueta}</a></li><li class="breadcrumb-item active" aria-current="page">${nombre}</li></ol></nav>
  <div class="d-flex gap-4 align-items-start mb-5 pb-4 border-bottom" style="border-color:var(--bk-line)!important">
    <div class="bk-entity-img ${tipo === "autor" ? "round" : ""} m-0 flex-shrink-0" style="width:7.5rem;max-width:none;font-size:2.5rem">${imgEntidad(nombre, tipo)}</div>
    <div class="flex-grow-1">
      <p class="bk-caption mb-1">${{ autor: "Autor", categoria: "Categoría", editorial: "Editorial" }[tipo]}</p>
      <h1 class="mb-2">${nombre}</h1>
      <p class="text-muted mb-0" style="max-width:44rem">${texto}</p>
    </div>
    <button class="btn btn-outline-primary flex-shrink-0" data-auth data-press="Siguiendo|Seguir" aria-pressed="false"><i class="bi bi-plus-lg me-1"></i><span class="lbl">Seguir</span></button>
  </div>
  <h2 class="mb-3">Libros</h2>
  <div data-results='{"orden":true,"periodo":"registro","desde":0,"n":8,"cols":4,"ocultar":"${tipo}","total":8}'></div>`;
</script>
</body>
</html>

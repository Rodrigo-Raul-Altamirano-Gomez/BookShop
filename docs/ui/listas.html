<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis listas · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="tienda" data-nav="listas">
<main id="contenido" class="container-xl pt-4">
  <nav aria-label="Ruta"><ol class="breadcrumb bk-breadcrumb mb-2"><li class="breadcrumb-item"><a href="cuenta-pedidos.html">Mi cuenta</a></li><li class="breadcrumb-item active" aria-current="page">Mis listas</li></ol></nav>
  <h1 class="mb-1">Mis listas</h1>
  <p class="text-muted mb-4" id="subtitulo"></p>
  <ul class="nav nav-underline mb-4" id="tabs"></ul>
  <div id="vista"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* Deseados y Favoritos en una sola pantalla a todo el ancho, con una pestaña por lista (?lista=deseados|favoritos).
   Usa la misma vista de resultados que el catálogo (4 columnas) con el botón "Quitar de la lista". */
const listaActual = new URLSearchParams(location.search).get("lista") || "deseados";
const LISTAS = {
  deseados: ["Deseados", "Libros que quieres comprar más adelante. Solo tú ves esta lista.", 2, 6],
  favoritos: ["Favoritos", "Los libros que más te gustaron. Solo tú ves esta lista.", 9, 5]
};
document.getElementById("tabs").innerHTML = Object.entries(LISTAS).map(([k, [n, , , cant]]) =>
  `<li class="nav-item"><a class="nav-link d-flex align-items-center gap-2 ${k === listaActual ? "active" : ""}" ${k === listaActual ? 'aria-current="page"' : ""} href="listas.html?lista=${k}">${n}</a></li>`).join("");
const [nombreL, subL, desdeL, cantL] = LISTAS[listaActual];
document.getElementById("subtitulo").textContent = subL;
document.title = `${nombreL} · BookShop`;
document.getElementById("vista").innerHTML = new URLSearchParams(location.search).has("vacia")
  ? `<div class="bk-panel">${emptyState("Aún no guardaste libros aquí.", "Usa el botón del detalle de cada libro.", "Explorar el catálogo", "catalogo.html")}</div>`
  : `<div data-results='{"orden":true,"periodo":"registro","desde":${desdeL},"n":${cantL},"cols":4,"quitar":true,"total":${cantL}}'></div>`;
</script>
</body>
</html>

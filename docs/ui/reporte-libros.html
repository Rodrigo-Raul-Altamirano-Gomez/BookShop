<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte de libros por monto vendido · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="doc" style="background:#8E877D">
<style>
  .bk-a4 { width: 1123px; min-height: 794px; margin: 2rem auto; background: #fff; padding: 48px 56px; box-shadow: 0 4px 24px rgba(0,0,0,.25); font-size: 12px; color: var(--bk-ink); }
  .bk-a4 table { width: 100%; border-collapse: collapse; }
  .bk-a4 th { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--bk-muted); text-align: left; border-bottom: 1.5px solid var(--bk-ink); padding: 6px 4px; }
  .bk-a4 td { padding: 7px 4px; border-bottom: 1px solid var(--bk-line); font-variant-numeric: tabular-nums; }
  .bk-a4 .r { text-align: right; }
  .bk-doc-bar { position: sticky; top: 0; background: #2A2622; color: #F7F4EE; padding: .5rem 1rem; font-size: .875rem; display: flex; gap: 1rem; align-items: center; }
</style>
<div class="bk-doc-bar"><i class="bi bi-file-earmark-pdf"></i>reporte-libros.pdf <span class="ms-auto opacity-75">Vista del PDF (JasperReports, RF18) · horizontal</span></div>
<main id="contenido" class="bk-a4">
  <div class="d-flex justify-content-between align-items-end mb-4 pb-3 border-bottom">
    <div><span class="bk-logo" style="font-size:22px">Book<span>Shop</span></span><h1 class="h2 mt-2 mb-0">Libros por monto vendido</h1></div>
    <div class="text-end bk-num">Período: 01/11/2026 – 30/11/2026<br>Generado: 20/11/2026 09:15<br>Resultados: 8</div>
  </div>
  <table>
    <thead><tr><th class="r">#</th><th>Título</th><th>Categoría</th><th>Autor</th><th>Editorial</th><th class="r">Cantidad</th><th class="r">Monto vendido</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>
  <p class="text-muted mt-4" style="font-size:10px">No incluye pedidos cancelados ni devueltos.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
const filas = [9, 0, 5, 2, 11, 1, 7, 3].map((i, k) => { const b = LIBROS[i]; const q = [42, 38, 31, 27, 22, 19, 15, 12][k]; return [b, q, q * final(b)]; });
document.getElementById("filas").innerHTML = filas.map(([b, q, m], k) =>
  `<tr><td class="r">${k + 1}</td><td>${b.t}</td><td>${b.cat}</td><td>${b.a}</td><td>${b.ed}</td><td class="r">${q}</td><td class="r">${soles(m)}</td></tr>`).join("") +
  `<tr><td colspan="5" style="border:0;padding-top:12px"><strong>Total</strong></td><td class="r" style="border:0;padding-top:12px"><strong>${filas.reduce((s, f) => s + f[1], 0)}</strong></td><td class="r" style="border:0;padding-top:12px"><strong>${soles(filas.reduce((s, f) => s + f[2], 0))}</strong></td></tr>`;
</script>
</body>
</html>

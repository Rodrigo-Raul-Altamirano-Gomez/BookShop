<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libros · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="admin" data-nav="admin-libros" data-rol="admin">
<main id="contenido" class="bk-admin-main">
  <div class="bk-page-head">
    <div><h1>Libros</h1><p class="small text-muted mb-0 mt-1 bk-num">124 libros · 118 activos</p></div>
    <a class="btn btn-primary" href="admin-libro.html"><i class="bi bi-plus-lg me-1"></i>Nuevo libro</a>
  </div>
  <div class="d-flex gap-2 mb-3">
    <div class="bk-search" style="max-width:20rem"><i class="bi bi-search"></i><input class="form-control" type="search" placeholder="Buscar por título" aria-label="Buscar por título" style="background:var(--bk-surface)"></div>
    <select class="form-select" style="width:auto" aria-label="Estado"><option>Todos</option><option>Activos</option><option>Inactivos</option></select>
  </div>
  <div class="bk-table-wrap">
    <table class="table table-hover bk-table">
      <thead><tr><th style="width:3.5rem"><span class="visually-hidden">Portada</span></th><th>Libro</th><th>Categoría</th><th class="text-end">Precio</th><th class="text-end">Stock</th><th>Estado</th><th class="text-end"><span class="visually-hidden">Acciones</span></th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-3">
    <span class="small text-muted bk-num">1–20 de 124</span>
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-left"></i></span></li>
      <li class="page-item active"><span class="page-link">1</span></li><li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li><li class="page-item"><a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a></li>
    </ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* La fila abre la consulta del libro; "Editar" abre directo la edición; "Desactivar/Activar" pide confirmación. */
document.getElementById("filas").innerHTML = LIBROS.map((b, i) => `
  <tr class="is-link" onclick="if (!event.target.closest('a,button')) location.href='admin-libro.html?id=${b.id}'">
    <td><div style="width:2rem">${cover(b, "bk-cover-sm")}</div></td>
    <td><strong class="d-block" style="font-family:var(--bk-font-serif);font-weight:500;font-size:1rem">${b.t}</strong><span class="small text-muted">${b.a}</span></td>
    <td>${b.cat}</td>
    <td class="text-end bk-num">${soles(final(b))}${b.d ? `<br><span class="bk-tag bk-tag-sale">−${b.d} %</span>` : ""}</td>
    <td class="text-end bk-num ${b.s === 0 ? "text-danger fw-semibold" : ""}">${b.s}</td>
    <td>${i === 6 ? '<span class="bk-status bk-status-neutral">Inactivo</span>' : '<span class="bk-status bk-status-ok">Activo</span>'}</td>
    <td class="text-end">${accionesFila(`href="admin-libro.html?id=${b.id}&editar=1"`, i !== 6, b.t, "o", `<button type="button" class="btn btn-sm btn-link text-decoration-none p-0" data-modal="#m-desc" data-libro="${b.t}">Agregar descuento</button>`)}</td>
  </tr>`).join("");
document.body.insertAdjacentHTML("beforeend", modalDescuento());
</script>
</body>
</html>

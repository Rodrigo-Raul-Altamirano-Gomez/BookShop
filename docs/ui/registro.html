<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="auth" data-rol="visitante">
<main id="contenido" class="mx-auto pb-5" style="max-width:36rem">
  <form class="bk-panel p-4">
    <h1 class="h2 mb-1">Crear cuenta</h1>
    <p class="text-muted small mb-4">Con tu cuenta podrás comprar, guardar libros y escribir reseñas.</p>

    <div class="d-flex align-items-center gap-3 mb-4">
      <span class="bk-avatar" style="width:4rem;height:4rem;font-size:1.1rem"><i class="bi bi-person fs-3"></i></span>
      <div><button type="button" class="btn btn-sm btn-outline-secondary">Elegir foto</button><div class="form-text">Foto (opcional). JPG o PNG.</div></div>
    </div>

    <label class="form-label" for="nombre">Nombre completo</label>
    <input class="form-control mb-3" id="nombre" autocomplete="name">

    <div class="row g-3 mb-3">
      <div class="col-7">
        <label class="form-label" for="correo">Correo</label>
        <input class="form-control is-invalid" id="correo" type="email" value="mariana@correo.pe" aria-describedby="correo-err">
        <div class="invalid-feedback" id="correo-err">Ya existe una cuenta con este correo.</div>
      </div>
      <div class="col-5">
        <label class="form-label" for="nac">Fecha de nacimiento</label>
        <input class="form-control" id="nac" type="date">
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6"><label class="form-label" for="c1">Contraseña</label><input class="form-control" id="c1" type="password" autocomplete="new-password"></div>
      <div class="col-6"><label class="form-label" for="c2">Confirmar contraseña</label><input class="form-control" id="c2" type="password" autocomplete="new-password"></div>
    </div>

    <a class="btn btn-primary btn-lg w-100" href="inicio.html">Crear cuenta</a>
    <p class="text-center small mt-4 mb-0">¿Ya tienes cuenta? <a class="fw-semibold" href="login.html">Inicia sesión</a></p>
  </form>
  <p class="small text-muted text-center mt-3">El campo «Correo» muestra cómo se ve un error de validación.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis reseñas · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-resenas">
<main id="contenido" class="container-xl pt-4">
  <div class="bk-page-head"><h1>Mis reseñas</h1></div>
  <div class="bk-panel py-0" id="lista"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
const MR = [
  [2, 5, "15/11/2026", "Una novela luminosa sobre la costa y la familia. El último capítulo es perfecto."],
  [7, 4, "02/11/2026", "Poemas breves y precisos. Algunos se repiten un poco en el tono, pero el conjunto es muy bello."],
  [4, 3, "21/10/2026", "Interesante, aunque esperaba más profundidad en los ensayos finales."]
];
document.getElementById("lista").innerHTML = MR.map(([id, p, f, c]) => {
  const b = libro(id);
  return `<div class="bk-line" style="grid-template-columns:3.5rem 1fr">
    <a href="libro.html?id=${id}">${cover(b, "bk-cover-sm")}</a>
    <div>
      <div class="d-flex align-items-baseline gap-3"><a class="bk-line-title" href="libro.html?id=${id}">${b.t}</a><span class="bk-stars ms-auto" aria-label="${p} de 5 estrellas">${estrellas(p)}</span></div>
      <div class="small text-muted bk-num mb-2">${f}</div>
      <p class="mb-0">${c}</p>
    </div></div>`;
}).join("");
</script>
</body>
</html>

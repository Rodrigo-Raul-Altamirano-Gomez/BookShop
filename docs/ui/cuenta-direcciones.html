<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direcciones · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-direcciones">
<main id="contenido" class="container-xl pt-4">
  <div class="bk-page-head"><h1>Direcciones</h1><button class="btn btn-primary" data-modal="#m-dir"><i class="bi bi-plus-lg me-1"></i>Agregar dirección</button></div>
  <div class="row row-cols-2 g-3">
    <div class="col" data-removible><div class="bk-panel h-100">
      <div class="d-flex align-items-center gap-2 mb-1"><strong>Casa</strong><span class="bk-status bk-status-neutral">Predeterminada</span></div>
      <p class="text-muted small mb-3">Jr. Domeyer 214, Barranco, Lima</p>
      <div class="d-flex gap-3"><button class="btn btn-sm btn-link text-decoration-none" data-modal="#m-dir">Editar</button>
        <button class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar la dirección «Casa»?" data-msg="Dejará de ofrecerse al pagar. Los pedidos que la usaron la seguirán mostrando." data-accion="Sí, eliminar" data-ok="Dirección eliminada" data-peligro>Eliminar</button></div>
    </div></div>
    <div class="col" data-removible><div class="bk-panel h-100">
      <div class="mb-1"><strong>Oficina</strong></div>
      <p class="text-muted small mb-3">Av. Javier Prado Este 1580, San Isidro, Lima</p>
      <div class="d-flex gap-3"><button class="btn btn-sm btn-link text-decoration-none" data-modal="#m-dir">Editar</button>
        <button class="btn btn-sm btn-link text-decoration-none" data-toast="Dirección predeterminada actualizada">Usar como predeterminada</button>
        <button class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar la dirección «Oficina»?" data-msg="Dejará de ofrecerse al pagar. Los pedidos que la usaron la seguirán mostrando." data-accion="Sí, eliminar" data-ok="Dirección eliminada" data-peligro>Eliminar</button></div>
    </div></div>
  </div>
</main>

<div class="modal fade" id="m-dir" tabindex="-1" aria-labelledby="m-dir-t" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content p-2">
    <div class="modal-header border-0 pb-0"><h2 class="modal-title h3" id="m-dir-t">Dirección</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">
      <label class="form-label" for="d-alias">Alias</label><input class="form-control mb-1" id="d-alias" placeholder="Casa, Oficina…"><div class="form-text mb-3">Un nombre corto para reconocerla.</div>
      <label class="form-label" for="d-dir">Dirección</label><input class="form-control mb-3" id="d-dir">
      <div class="row g-3"><div class="col-6"><label class="form-label" for="d-dis">Distrito</label><input class="form-control" id="d-dis"></div><div class="col-6"><label class="form-label" for="d-ciu">Ciudad</label><input class="form-control" id="d-ciu"></div></div>
    </div>
    <div class="modal-footer border-0"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-toast="Dirección guardada">Guardar dirección</button></div>
  </form></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
</body>
</html>

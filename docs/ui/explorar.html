<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="tienda" data-nav="explorar">
<main id="contenido" class="container-xl pt-4">
  <nav aria-label="Ruta"><ol class="breadcrumb bk-breadcrumb mb-2"><li class="breadcrumb-item"><a href="inicio.html">Inicio</a></li><li class="breadcrumb-item active" aria-current="page">Explorar</li></ol></nav>
  <h1 class="mb-4">Explorar</h1>
  <ul class="nav nav-underline mb-4" id="tabs"></ul>
  <div class="bk-toolbar">
    <div class="bk-search flex-grow-1" style="max-width:24rem"><i class="bi bi-search"></i><input class="form-control" type="search" id="buscar" style="background:var(--bk-surface)"></div>
    <span class="small text-muted bk-num" id="total"></span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <label class="small text-muted text-nowrap" for="orden">Ordenar por</label>
      <select class="form-select form-select-sm" id="orden" style="width:auto"><option value="asc">Nombre A–Z</option><option value="desc">Nombre Z–A</option></select>
    </div>
  </div>
  <div class="bk-grid-6" id="grid"></div>
  <nav class="d-flex justify-content-center mt-5" aria-label="Páginas"><ul class="pagination mb-0">
    <li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-left"></i></span></li>
    <li class="page-item active"><span class="page-link">1</span></li>
    <li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-right"></i></span></li></ul></nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
const tipo = new URLSearchParams(location.search).get("tipo") || "autor";
const T = { autor: ["Autores", AUTORES, "Buscar autores por nombre"], categoria: ["Categorías", CATEGORIAS, "Buscar categorías por nombre"], editorial: ["Editoriales", EDITORIALES, "Buscar editoriales por nombre"] };
document.getElementById("tabs").innerHTML = Object.entries(T).map(([k, [n]]) =>
  `<li class="nav-item"><a class="nav-link ${k === tipo ? "active" : ""}" ${k === tipo ? 'aria-current="page"' : ""} href="explorar.html?tipo=${k}">${n}</a></li>`).join("");
const [nombre, lista, ph] = T[tipo];
document.getElementById("buscar").placeholder = ph;
document.getElementById("buscar").setAttribute("aria-label", ph);
document.getElementById("total").textContent = `${lista.length} ${nombre.toLowerCase()}`;
/* Orden por nombre (RF05): al cambiarlo se reordena y se vuelve a la página 1 */
const pintar = dir => {
  const orden = [...lista].sort((a, b) => a.localeCompare(b, "es") * (dir === "desc" ? -1 : 1));
  document.getElementById("grid").innerHTML = orden.map(x => `<div>${entityCard(x, tipo)}</div>`).join("");
};
pintar("asc");
document.getElementById("orden").addEventListener("change", e => pintar(e.target.value));
</script>
</body>
</html>

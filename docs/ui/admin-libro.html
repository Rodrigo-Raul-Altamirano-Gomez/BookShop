<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libro · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="admin" data-nav="admin-libros" data-rol="admin">
<main id="contenido" class="bk-admin-main"></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* Sin ?id = nuevo libro. Con ?id = edición (referencias bloqueadas y panel de descuentos). */
const idL = new URLSearchParams(location.search).get("id");
const L = idL ? libro(idL) : null;
const v = k => L ? L[k] : "";
const opciones = (lista, sel) => `<option value="">Elige una opción</option>` + lista.slice(0, 9).map(x => `<option ${x === sel ? "selected" : ""}>${x}</option>`).join("");
const ref = (lbl, id, lista, val) => L
  ? `<div class="col-4"><span class="form-label d-block">${lbl}</span><div class="form-control d-flex align-items-center gap-2" style="background:var(--bk-sunken)"><i class="bi bi-lock text-muted"></i>${val}</div></div>`
  : `<div class="col-4"><label class="form-label" for="${id}">${lbl}</label><select class="form-select" id="${id}">${opciones(lista)}</select></div>`;

document.getElementById("contenido").innerHTML = `
  <nav aria-label="Ruta"><ol class="breadcrumb bk-breadcrumb mb-2"><li class="breadcrumb-item"><a href="admin-libros.html">Libros</a></li><li class="breadcrumb-item active" aria-current="page">${L ? L.t : "Nuevo libro"}</li></ol></nav>
  <div class="bk-page-head"><h1>${L ? "Editar libro" : "Nuevo libro"}</h1></div>

  <form class="row g-4">
    <div class="col-3">
      <div class="bk-panel text-center">
        ${L ? cover(L) : `<div class="bk-cover d-flex align-items-center justify-content-center text-muted" style="box-shadow:none;border:1px dashed var(--bk-line-strong)"><i class="bi bi-image fs-2"></i></div>`}
        <button type="button" class="btn btn-sm btn-outline-secondary mt-3 w-100">Elegir imagen</button>
        <div class="form-text">Portada. JPG o PNG.</div>
      </div>
    </div>
    <div class="col-9 d-grid gap-4">
      <section class="bk-panel">
        <h2 class="h3 mb-3">Datos</h2>
        <div class="row g-3">
          <div class="col-8"><label class="form-label" for="tit">Título</label><input class="form-control" id="tit" value="${v("t")}"></div>
          <div class="col-4"><label class="form-label" for="isbn">ISBN</label><input class="form-control bk-num" id="isbn" value="${L ? "978-612-4567-" + String(L.id).padStart(2, "0") + "-3" : ""}"></div>
          <div class="col-12"><label class="form-label" for="sin">Sinopsis</label><textarea class="form-control" id="sin" rows="4">${L ? "En una casa de Barranco donde ningún reloj marca la misma hora, tres generaciones de mujeres guardan un secreto…" : ""}</textarea></div>
          <div class="col-4"><label class="form-label" for="idi">Idioma</label><select class="form-select" id="idi"><option ${v("idi") === "Español" ? "selected" : ""}>Español</option><option ${v("idi") === "Inglés" ? "selected" : ""}>Inglés</option></select></div>
          <div class="col-4"><label class="form-label" for="pag">Páginas</label><input class="form-control bk-num" id="pag" type="number" value="${v("pag")}"></div>
          <div class="col-4"><label class="form-label" for="anio">Año de publicación</label><input class="form-control bk-num" id="anio" type="number" value="${v("anio")}"></div>
        </div>
      </section>

      <section class="bk-panel">
        <h2 class="h3 mb-1">Referencias</h2>
        <p class="small text-muted mb-3">${L ? "No se pueden cambiar después de registrar el libro." : "Solo se muestran los activos. No podrán cambiarse después de registrar el libro."}</p>
        <div class="row g-3">${ref("Autor", "aut", AUTORES, v("a"))}${ref("Categoría", "cat", CATEGORIAS, v("cat"))}${ref("Editorial", "edi", EDITORIALES, v("ed"))}</div>
      </section>

      <section class="bk-panel">
        <h2 class="h3 mb-3">Precio y stock</h2>
        <div class="row g-3">
          <div class="col-4"><label class="form-label" for="pre">Precio</label><div class="input-group"><span class="input-group-text">S/</span><input class="form-control bk-num" id="pre" type="number" step="0.01" value="${L ? L.p.toFixed(2) : ""}"></div></div>
          <div class="col-4"><label class="form-label" for="sto">Stock</label><input class="form-control bk-num" id="sto" type="number" value="${v("s")}"></div>
        </div>
        <div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" id="act" checked><label class="form-check-label fw-semibold" for="act">Activo</label>
          <div class="form-text">Los libros inactivos no se muestran en la tienda.</div></div>
      </section>

      ${L ? `<section class="bk-panel">
        <h2 class="h3 mb-1">Descuentos</h2>
        <p class="small text-muted mb-3">Los descuentos de un libro no pueden superponerse en fechas.</p>
        <div class="bk-table-wrap mb-3"><table class="table bk-table">
          <thead><tr><th class="text-end">Porcentaje</th><th>Desde</th><th>Hasta</th><th>Estado</th><th class="text-end"><span class="visually-hidden">Acciones</span></th></tr></thead>
          <tbody>
            <tr data-removible><td class="text-end bk-num">20 %</td><td class="bk-num">15/11/2026</td><td class="bk-num">30/11/2026</td><td><span class="bk-status bk-status-ok">Vigente</span></td><td class="text-end"><button type="button" class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar este descuento?" data-msg="El precio del libro volverá a ser S/ ${L.p.toFixed(2)} en ese período." data-accion="Sí, eliminar" data-ok="Descuento eliminado" data-peligro>Eliminar</button></td></tr>
            <tr data-removible><td class="text-end bk-num">10 %</td><td class="bk-num">01/12/2026</td><td class="bk-num">15/12/2026</td><td><span class="bk-status bk-status-info">Programado</span></td><td class="text-end"><button type="button" class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar este descuento?" data-msg="El descuento programado no se aplicará." data-accion="Sí, eliminar" data-ok="Descuento eliminado" data-peligro>Eliminar</button></td></tr>
            <tr><td class="text-end bk-num">15 %</td><td class="bk-num">01/10/2026</td><td class="bk-num">15/10/2026</td><td><span class="bk-status bk-status-neutral">Finalizado</span></td><td></td></tr>
          </tbody></table></div>
        <div class="row g-3 align-items-end">
          <div class="col-2"><label class="form-label" for="dp">Porcentaje</label><div class="input-group"><input class="form-control bk-num" id="dp" type="number" value="15"><span class="input-group-text">%</span></div></div>
          <div class="col-3"><label class="form-label" for="dd">Desde</label><input class="form-control is-invalid" id="dd" type="date" value="2026-12-10" aria-describedby="dd-err"></div>
          <div class="col-3"><label class="form-label" for="dh">Hasta</label><input class="form-control is-invalid" id="dh" type="date" value="2026-12-20" aria-describedby="dd-err"></div>
          <div class="col-4"><button type="button" class="btn btn-outline-primary w-100">Agregar descuento</button></div>
          <div class="col-12 mt-1"><div class="text-danger small" id="dd-err">Se superpone con el descuento del 01/12 al 15/12.</div></div>
        </div>
      </section>` : ""}
    </div>
  </form>

  <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top" style="border-color:var(--bk-line)!important;position:sticky;bottom:0;background:var(--bk-paper);padding-bottom:1rem">
    <a class="btn btn-outline-secondary" href="admin-libros.html">Cancelar</a>
    <button type="button" class="btn btn-primary" data-toast="${L ? "Cambios guardados" : "Libro registrado"}">${L ? "Guardar cambios" : "Registrar libro"}</button>
  </div>`;
</script>
</body>
</html>

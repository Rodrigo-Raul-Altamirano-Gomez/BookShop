<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del pedido · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-pedidos">
<main id="contenido" class="container-xl pt-4"></main>

<div class="modal fade" id="m-dev" tabindex="-1" aria-labelledby="m-dev-t" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content p-2">
    <div class="modal-header border-0 pb-0"><h2 class="modal-title h3" id="m-dev-t">Solicitar devolución</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">
      <p class="text-muted small">La devolución es del pedido completo. Si se acepta, el pedido pasará a «Devuelto».</p>
      <fieldset class="mb-3"><legend class="form-label">Motivo</legend>
        <div class="form-check"><input class="form-check-input" type="radio" name="mot" id="d1" checked><label class="form-check-label" for="d1">Producto dañado</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="mot" id="d2"><label class="form-check-label" for="d2">Producto equivocado</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="mot" id="d3"><label class="form-check-label" for="d3">Ya no lo quiero</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="mot" id="d4"><label class="form-check-label" for="d4">Otro</label></div>
      </fieldset>
      <label class="form-label" for="dc">Comentario</label><textarea class="form-control" id="dc" rows="3"></textarea>
    </div>
    <div class="modal-footer border-0"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-toast="Solicitud enviada. Puedes verla en Mis solicitudes.|Ver|cuenta-solicitudes.html">Enviar solicitud</button></div>
  </form></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* Variantes: ?estado=almacen | limite | camino | entregado | revision | cancelado | devuelto
   limite = en almacén con el límite de cancelaciones alcanzado; revision = entregado con devolución pendiente */
const estado = new URLSearchParams(location.search).get("estado") || "camino";
const E = {
  almacen:   ["N.º 1046", "En almacén", "neutral", 1],
  limite:    ["N.º 1046", "En almacén", "neutral", 1],
  camino:    ["N.º 1045", "En camino", "info", 2],
  entregado: ["N.º 1032", "Entregado", "ok", 3],
  revision:  ["N.º 1032", "Entregado", "ok", 3],
  cancelado: ["N.º 1011", "Cancelado", "bad", 1],
  devuelto:  ["N.º 1019", "Devuelto", "warn", 3]
};
const [num, txt, cls, alcanzados] = E[estado];
const P = PEDIDOS.find(x => x.estado === ({ limite: "almacen", revision: "entregado" }[estado] || estado));
const IM = importes(P);
const filaLibro = ([id, q]) => { const b = libro(id); return `<tr><td><div class="d-flex align-items-center gap-2"><div style="width:2rem;flex-shrink:0">${cover(b, "bk-cover-sm")}</div><a class="text-reset" href="libro.html?id=${id}">${b.t}</a></div></td><td class="text-end bk-num">${q}</td><td class="text-end bk-num">${soles(final(b))}${b.d ? `<br><span class="small text-muted text-decoration-line-through">${soles(b.p)}</span>` : ""}</td><td class="text-end bk-num">${soles(final(b) * q)}</td></tr>`; };
const mas = m => `${P.fecha} ${P.hora.slice(0, 3)}${String(+P.hora.slice(3) + m).padStart(2, "0")}`;
const hitos = [["Compra", mas(0)], ["Salida del almacén", mas(2)], ["Entrega", mas(3)]];
let linea = hitos.map(([n, f], i) => i < alcanzados
  ? `<li class="done"><span class="dot"></span><div class="label fw-semibold">${n}</div><div class="when">${f}</div></li>`
  : (estado === "cancelado" ? "" : `<li><span class="dot"></span><div class="label">${n}</div><div class="when">Pendiente</div></li>`)).join("");
if (estado === "cancelado") linea += `<li class="done"><span class="dot" style="background:var(--bk-red);border-color:var(--bk-red)"></span><div class="label fw-semibold text-danger">Cancelación</div><div class="when">${mas(1)}</div></li>`;
if (estado === "devuelto") linea += `<li class="done"><span class="dot" style="background:var(--bk-ochre);border-color:var(--bk-ochre)"></span><div class="label fw-semibold" style="color:var(--bk-ochre)">Devolución</div><div class="when">22/11/2026 16:10</div></li>`;

const acciones = {
  almacen: `<button class="btn btn-outline-danger" data-confirm="¿Cancelar el pedido N.º 1046?" data-msg="Se repondrá el stock y no podrás deshacerlo. Te quedan 2 cancelaciones este mes." data-accion="Sí, cancelar pedido" data-href="pedido.html?estado=cancelado" data-peligro>Cancelar pedido</button>`,
  limite: `<button class="btn btn-outline-danger" disabled>Cancelar pedido</button><p class="form-text text-center mb-0">Alcanzaste el límite de cancelaciones de este mes.</p>`,
  camino: `<button class="btn btn-outline-danger" disabled>Cancelar pedido</button><p class="form-text text-center mb-0">Solo se pueden cancelar pedidos en almacén.</p>`,
  revision: `<div class="alert alert-warning mb-0"><i class="bi bi-hourglass-split"></i><div>Solicitud de devolución en revisión. <a href="cuenta-solicitudes.html">Ver en Mis solicitudes</a></div></div>`,
  entregado: `<button class="btn btn-outline-secondary" data-modal="#m-dev">Solicitar devolución</button><p class="form-text text-center mb-0">Puedes solicitarla hasta el 26/11/2026.</p>`,
  cancelado: "", devuelto: ""
}[estado];

document.getElementById("contenido").innerHTML = `
  <nav aria-label="Ruta"><ol class="breadcrumb bk-breadcrumb mb-2"><li class="breadcrumb-item"><a href="cuenta-pedidos.html">Pedidos</a></li><li class="breadcrumb-item active" aria-current="page">${num}</li></ol></nav>
  <div class="d-flex align-items-center gap-3 mb-1"><h1 class="mb-0">Pedido ${num}</h1><span class="bk-status bk-status-${cls}">${txt}</span></div>
  <p class="text-muted small bk-num mb-4">Fecha de compra: ${P.fecha}, ${P.hora}</p>
  <div class="row g-4">
    <div class="col-7">
      <div class="bk-table-wrap"><table class="table bk-table">
        <thead><tr><th>Libro</th><th class="text-end">Cant.</th><th class="text-end">Precio</th><th class="text-end">Subtotal</th></tr></thead>
        <tbody>${P.libros.map(filaLibro).join("")}
        </tbody></table></div>
      <div class="bk-summary ms-auto mt-3" style="max-width:20rem"><dl>
        <dt>Subtotal</dt><dd>${soles(IM.subtotal)}</dd>${IM.cupon ? `<dt>Cupón BK7Q2 (10 %)</dt><dd class="minus">− ${soles(IM.cupon)}</dd>` : ""}<dt>Envío</dt><dd>${soles(IM.envio)}</dd>
        <dt class="fw-semibold text-body pt-2">Total</dt><dd class="total pt-2">${soles(IM.total)}</dd></dl></div>
    </div>
    <aside class="col-5">
      <div class="bk-panel mb-3">
        <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h3 mb-0">Seguimiento</h2>
          <span class="small"><span class="bk-code">SG-7Q2K-1045</span></span></div>
        <ol class="bk-timeline">${linea}</ol>
      </div>
      <div class="bk-panel mb-3"><dl class="bk-kv mb-0">
        <dt>Dirección</dt><dd>Casa · Jr. Domeyer 214, Barranco, Lima</dd>
        <dt>Método de pago</dt><dd class="bk-num">Tarjeta •••• 4821</dd>
        <dt>Código de transacción</dt><dd class="mb-0"><span class="bk-code">TX-20261119-8F3A</span></dd></dl></div>
      <div class="d-grid gap-2">
        <a class="btn btn-primary" href="comprobante.html" target="_blank"><i class="bi bi-file-earmark-arrow-down me-2"></i>Descargar comprobante</a>
        ${acciones}
      </div>
    </aside>
  </div>`;
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Métodos de pago · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-metodos">
<main id="contenido" class="container-xl pt-4">
  <div class="bk-page-head"><h1>Métodos de pago</h1><button class="btn btn-primary" data-modal="#m-metodo"><i class="bi bi-plus-lg me-1"></i>Agregar método de pago</button></div>
  <div class="row row-cols-2 g-3">
    <div class="col" data-removible><div class="bk-panel h-100">
      <div class="d-flex align-items-center gap-2 mb-1"><strong><i class="bi bi-credit-card me-1"></i>Tarjeta</strong><span class="bk-status bk-status-neutral">Predeterminado</span></div>
      <p class="text-muted small bk-num mb-3">Mariana Soto · •••• •••• •••• 4821 · vence 08/27</p>
      <div class="d-flex gap-3"><button class="btn btn-sm btn-link text-decoration-none" data-modal="#m-metodo">Editar</button>
        <button class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar la tarjeta •••• 4821?" data-msg="Dejará de ofrecerse al pagar. Los pedidos que la usaron la seguirán mostrando." data-accion="Sí, eliminar" data-ok="Método de pago eliminado" data-peligro>Eliminar</button></div>
    </div></div>
    <div class="col" data-removible><div class="bk-panel h-100">
      <div class="mb-1"><strong><i class="bi bi-phone me-1"></i>Yape</strong></div>
      <p class="text-muted small bk-num mb-3">Mariana Soto · ••••• 4321</p>
      <div class="d-flex gap-3"><button class="btn btn-sm btn-link text-decoration-none" data-modal="#m-metodo">Editar</button>
        <button class="btn btn-sm btn-link text-decoration-none" data-toast="Método predeterminado actualizado">Usar como predeterminado</button>
        <button class="btn btn-sm btn-link text-decoration-none text-danger" data-confirm="¿Eliminar Yape •••• 4321?" data-msg="Dejará de ofrecerse al pagar. Los pedidos que lo usaron lo seguirán mostrando." data-accion="Sí, eliminar" data-ok="Método de pago eliminado" data-peligro>Eliminar</button></div>
    </div></div>
  </div>
</main>

<div class="modal fade" id="m-metodo" tabindex="-1" aria-labelledby="m-metodo-t" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content p-2">
    <div class="modal-header border-0 pb-0"><h2 class="modal-title h3" id="m-metodo-t">Método de pago</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body">
      <ul class="nav nav-underline mb-3" role="tablist">
        <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#t-tar" role="tab">Tarjeta</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#t-bil" role="tab">Billetera digital</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="t-tar" role="tabpanel">
          <label class="form-label" for="m-tit">Titular</label><input class="form-control mb-3" id="m-tit">
          <label class="form-label" for="m-num">Número</label><input class="form-control is-invalid bk-num" id="m-num" value="4111222233334821" aria-describedby="m-num-err"><div class="invalid-feedback mb-3" id="m-num-err">Ya registraste un método de pago con este número.</div>
          <label class="form-label mt-2" for="m-ven">Vencimiento</label><input class="form-control" id="m-ven" placeholder="MM/AA" style="max-width:8rem">
        </div>
        <div class="tab-pane fade" id="t-bil" role="tabpanel">
          <label class="form-label" for="b-pro">Proveedor</label><select class="form-select mb-3" id="b-pro"><option>Yape</option><option>Plin</option></select>
          <label class="form-label" for="b-tit">Titular</label><input class="form-control mb-3" id="b-tit">
          <label class="form-label" for="b-cel">Celular</label><input class="form-control bk-num" id="b-cel"><div class="form-text">9 dígitos.</div>
        </div>
      </div>
    </div>
    <div class="modal-footer border-0"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-toast="Método de pago guardado">Guardar método</button></div>
  </form></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
</body>
</html>

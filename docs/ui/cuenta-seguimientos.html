<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimientos · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-seguimientos">
<main id="contenido" class="container-xl pt-4">
  <div class="bk-page-head"><div><h1>Seguimientos</h1><p class="text-muted small mb-0 mt-1">Autores, categorías y editoriales que sigues.</p></div></div>
  <ul class="nav nav-underline mb-4" id="tabs"></ul>
  <div id="seg-vista"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* Seguimientos con el patrón de Explorar: una pestaña por tipo (?tipo=autor|categoria|editorial),
   buscador + total + orden, cuadrícula de 5 columnas y páginas de 24. */
const pqS = new URLSearchParams(location.search);
const tipoSeg = pqS.get("tipo") || "autor";
/* [nombre, fecha de seguimiento (aaaa-mm-dd)] */
const SIGUE = {
  autor: [["Inés Valdivia", "2026-11-12"], ["Tomás Arguedas", "2026-10-30"], ["Lucía Ferrán", "2026-11-18"], ["Marco Salazar", "2026-09-02"],
          ["Carmen Rivas", "2026-08-15"], ["Hugo Benavides", "2026-11-05"], ["Elena Castañeda", "2026-07-21"], ["Pablo Iturbe", "2026-10-11"]],
  categoria: [["Novela", "2026-06-10"], ["Poesía", "2026-09-19"], ["Fantasía", "2026-11-01"]],
  editorial: [["Ediciones Faro", "2026-10-02"], ["Grulla", "2026-11-14"]]
};
const TIPOS_SEG = { autor: ["Autores", "autores", "ningún autor", "Explorar autores"], categoria: ["Categorías", "categorías", "ninguna categoría", "Explorar categorías"], editorial: ["Editoriales", "editoriales", "ninguna editorial", "Explorar editoriales"] };
const lista = pqS.has("vacia") ? [] : SIGUE[tipoSeg];
const [tituloSeg, pluralSeg, ningunoSeg, accionSeg] = TIPOS_SEG[tipoSeg];

document.getElementById("tabs").innerHTML = Object.entries(TIPOS_SEG).map(([k, [n]]) =>
  `<li class="nav-item"><a class="nav-link d-flex align-items-center gap-2 ${k === tipoSeg ? "active" : ""}" ${k === tipoSeg ? 'aria-current="page"' : ""} href="cuenta-seguimientos.html?tipo=${k}">${n}</a></li>`).join("");

document.getElementById("seg-vista").innerHTML = !lista.length
  ? `<div class="bk-panel">${emptyState(`No sigues a ${ningunoSeg}.`, "Lo que sigas desde su página aparecerá aquí.", accionSeg, `explorar.html?tipo=${tipoSeg}`)}</div>`
  : `<div class="bk-toolbar">
      <div class="bk-search flex-grow-1" style="max-width:20rem"><i class="bi bi-search"></i><input class="form-control" type="search" placeholder="Buscar ${pluralSeg} por nombre" aria-label="Buscar ${pluralSeg} por nombre" style="background:var(--bk-surface)"></div>
      <span class="small text-muted bk-num">${lista.length} ${pluralSeg}</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="small text-muted text-nowrap" for="orden-seg">Ordenar por</label>
        <select class="form-select form-select-sm" id="orden-seg" style="width:auto"><option value="asc">Nombre A–Z</option><option value="desc">Nombre Z–A</option><option value="fecha">Seguido recientemente</option></select>
      </div>
    </div>
    <div class="bk-grid-5" id="seg-grid"></div>
    <nav class="d-flex justify-content-center mt-5" aria-label="Páginas"><ul class="pagination mb-0">
      <li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-left"></i></span></li>
      <li class="page-item active"><span class="page-link">1</span></li>
      <li class="page-item disabled"><span class="page-link"><i class="bi bi-chevron-right"></i></span></li></ul></nav>`;

const pintarSeg = modo => {
  const g = document.getElementById("seg-grid");
  if (!g) return;
  const orden = [...lista].sort((a, b) => modo === "fecha" ? b[1].localeCompare(a[1]) : a[0].localeCompare(b[0], "es") * (modo === "desc" ? -1 : 1));
  g.innerHTML = orden.map(([n]) => `<div class="text-center">${entityCard(n, tipoSeg)}
    <button class="btn btn-sm btn-link text-decoration-none text-muted mt-1" data-toast="Dejaste de seguir a ${n}" onclick="this.parentElement.remove()">Dejar de seguir</button></div>`).join("");
};
pintarSeg("asc");
/* Delegado en document: el diseño de Mi cuenta vuelve a montar el contenido */
document.addEventListener("change", e => { if (e.target.id === "orden-seg") pintarSeg(e.target.value); });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos · BookShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body data-layout="cuenta" data-nav="cuenta-pedidos">
<main id="contenido" class="container-xl pt-4">
  <div class="bk-page-head"><h1>Pedidos</h1></div>
  <div class="d-flex align-items-center gap-2 mb-3">
    <a class="bk-chip bk-chip-toggle active" href="#" aria-pressed="true">Todos</a>
    <a class="bk-chip bk-chip-toggle" href="#">En almacén</a>
    <a class="bk-chip bk-chip-toggle" href="#">En camino</a>
    <a class="bk-chip bk-chip-toggle" href="#">Entregado</a>
    <a class="bk-chip bk-chip-toggle" href="#">Cancelado</a>
    <a class="bk-chip bk-chip-toggle" href="#">Devuelto</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <label class="small text-muted text-nowrap" for="ord">Ordenar por</label>
      <select class="form-select form-select-sm" id="ord" style="width:auto"><option>Más recientes</option><option>Más antiguos</option><option>Mayor total</option><option>Menor total</option></select>
    </div>
  </div>
  <div class="bk-table-wrap">
    <table class="table table-hover bk-table">
      <thead><tr><th>Pedido</th><th>Fecha de compra</th><th class="text-end">Libros</th><th class="text-end">Total</th><th>Estado</th><th class="text-end"><span class="visually-hidden">Acciones</span></th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock.js"></script>
<script>
/* Cada fila identifica el pedido por las portadas de sus libros y su número */
document.getElementById("filas").innerHTML = PEDIDOS.map(p => {
  const im = importes(p), [txt, cls] = ESTADOS[p.estado], url = `pedido.html?estado=${p.estado}`;
  return `<tr class="is-link" onclick="location.href='${url}'">
    <td><div class="d-flex align-items-center gap-3">${coverStack(p.libros.map(([id]) => id))}<span class="fw-semibold text-nowrap">N.º ${p.num}</span></div></td>
    <td class="bk-num">${p.fecha}</td>
    <td class="text-end bk-num">${im.unidades}</td>
    <td class="text-end bk-num">${soles(im.total)}</td>
    <td><span class="bk-status bk-status-${cls}">${txt}</span></td>
    <td class="text-end"><a class="btn btn-sm btn-link text-decoration-none" href="${url}">Ver detalle</a></td></tr>`;
}).join("");
</script>
</body>
</html>
